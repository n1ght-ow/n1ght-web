<!DOCTYPE html>
<html lang="zh-CN" data-world="overview">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171914">
  <title>N1GHT CHXN9 · 夜间陈列室</title>
  <meta name="description" content="N1GHT CHXN9 的私人艺术馆。走近一张照片、翻开一本书，从九类馆藏里编排自己的展览。">
  <meta property="og:title" content="N1GHT CHXN9 · 夜间陈列室">
  <meta property="og:description" content="浏览私人馆藏，动手操作展品，编排你的展览。">
  <link rel="icon" href="../assets/icons/night-enamel-32.png?v=1" type="image/png">
  <link rel="stylesheet" href="../css/fonts.css?v=15">
  <link rel="stylesheet" href="../css/world.css?v=12">
</head>
<body>
  <a class="skip-link" href="#room-nav">跳到展区索引</a>
  <header class="world-header">
    <a class="brand" href="#world" aria-label="N1GHT CHXN9，返回入口"><span class="brand-mark" aria-hidden="true">✳</span>N1GHT CHXN9</a>
    <nav aria-label="浏览选项">
      <button id="map-toggle" type="button">展区索引 <span aria-hidden="true">↗</span></button>
      <button id="curation-toggle" type="button">我的展览 <span id="saved-count">0</span></button>
      <a class="back-home" href="../">普通版 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="world">
    <section class="world-intro" aria-labelledby="world-title">
      <div class="intro-kicker">NIGHT GALLERY <span aria-hidden="true"></span></div>
      <h1 id="world-title">夜间<br>陈列室</h1>
      <p class="intro-description">照片、书页和银幕里，<br>留着我反复回看的东西。</p>
      <a class="primary-button" id="start-explore" href="#photo">走进摄影展区 <span aria-hidden="true">→</span></a>
    </section>
    <header class="room-heading" id="room-heading" hidden>
      <a class="back-button" id="room-back" href="#world">← 入口</a>
      <p id="room-english" class="eyebrow"></p>
      <h1 id="room-title" tabindex="-1"></h1>
      <p id="room-description"></p>
    </header>
    <section class="world-stage" id="world-stage" aria-label="展厅">
      <div class="stage-preview" id="stage-preview">
        <img id="stage-poster" src="../photo/wall/1791482278707.webp?v=1" alt="晚霞下的江面与远处天际线" fetchpriority="high">
        <div class="stage-text" id="stage-text" hidden><strong></strong><p></p></div>
      </div>
      <canvas id="world-canvas" tabindex="0" aria-label="三维展厅。拖动空白处或使用方向键调整视角。在展品上拖动或点按机关。"></canvas>
      <div id="model-pins" class="model-pins" aria-label="场景操作"></div>
      <a class="featured-label" id="featured-link" href="#photo"><span>入口展品 · 摄影</span><strong>The last red light <span aria-hidden="true">↗</span></strong></a>
      <div class="world-tools" aria-label="场景视角">
        <button id="zoom-out" type="button" aria-label="缩小场景">−</button>
        <button id="zoom-in" type="button" aria-label="放大场景">＋</button>
        <button id="reset-view" type="button" aria-label="恢复场景视角">复位</button>
      </div>
      <p id="world-loading" role="status" hidden></p>
    </section>
    <aside class="room-panel" id="room-panel" aria-labelledby="room-title" hidden>
      <div class="room-tabs" role="tablist" aria-label="当前展区">
        <button id="operate-tab" type="button" role="tab" aria-selected="true" aria-controls="operate-panel">操作展品</button>
        <button id="catalogue-tab" type="button" role="tab" aria-selected="false" aria-controls="catalogue-panel" tabindex="-1">浏览馆藏</button>
      </div>
      <section id="operate-panel" role="tabpanel" aria-labelledby="operate-tab">
        <p class="room-hint" id="room-hint"></p>
        <div id="model-controls" class="model-controls"></div>
        <p class="model-status" id="model-status" role="status"></p>
        <div id="room-actions" class="room-actions"></div>
      </section>
      <section id="catalogue-panel" role="tabpanel" aria-labelledby="catalogue-tab" hidden>
        <div class="catalogue-heading"><span id="catalogue-count"></span><button id="random-item" class="text-button" type="button">随机看一件 ↗</button></div>
        <label class="search-wrap"><span class="sr-only">搜索本展区</span><input type="search" id="collection-search" placeholder="搜索作品或作者"></label>
        <div id="catalogue-items" class="catalogue-items" aria-label="馆藏目录"></div>
        <form id="curation-form" class="curation-form" hidden>
          <label>展览名称<input id="exhibition-title" maxlength="36" value="我的小展览"></label>
          <label>展览题签<input id="exhibition-subtitle" maxlength="100"></label>
          <button class="primary-button" id="export-png" type="submit">保存展览海报 <span aria-hidden="true">↓</span></button>
        </form>
      </section>
    </aside>
    <nav class="room-dock" id="room-nav" aria-label="展区索引" tabindex="-1">
      <div class="dock-caption"><span>展区</span><span>GALLERIES</span></div>
      <div class="dock-items" id="dock-items"></div>
    </nav>
  </main>
  <dialog id="atlas-dialog" class="atlas-dialog" aria-labelledby="atlas-title">
    <div class="dialog-top"><h2 id="atlas-title">展区索引</h2><button class="close-button" type="button" data-close="atlas-dialog" aria-label="关闭展区索引">×</button></div>
    <div id="atlas-list" class="atlas-list"></div>
    <nav class="atlas-foot" aria-label="更多入口"><a href="../">返回普通版 ↗</a><a href="../myscore/">MyScore ↗</a></nav>
  </dialog>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title">
    <button class="close-button detail-close" type="button" data-close="detail-dialog" aria-label="关闭藏品详情">×</button>
    <div class="detail-visual" id="detail-visual"></div>
    <div class="detail-copy">
      <p class="eyebrow" id="detail-category"></p><h2 id="detail-title"></h2><p class="detail-meta" id="detail-meta"></p>
      <div class="detail-description" id="detail-description"></div>
      <div class="detail-actions"><button id="save-item" class="primary-button" type="button">收入我的展览 <span aria-hidden="true">＋</span></button><a id="detail-source" target="_blank" rel="noopener noreferrer">前往作品来源 ↗</a></div>
      <div class="detail-pagination"><button id="detail-prev" class="text-button" type="button">← 上一件</button><span id="detail-position"></span><button id="detail-next" class="text-button" type="button">下一件 →</button></div>
    </div>
  </dialog>
  <div class="model-tooltip" id="model-tooltip" hidden aria-hidden="true"><strong id="model-tooltip-title"></strong><span id="model-tooltip-hint"></span></div>
  <div class="toast" id="toast" role="status"></div>
  <noscript><p class="noscript-notice">启用 JavaScript 后可操作展品。<a href="../">前往普通版</a></p></noscript>
  <script src="../js/film-data.js?v=4"></script><script src="../js/series-data.js?v=4"></script><script src="../js/book-shelf-data.js?v=6"></script><script src="../js/music-data.js?v=7"></script><script src="../js/poems-data.js?v=2"></script><script src="../js/paintings-data.js?v=1"></script><script src="../js/music-covers.js?v=6"></script>
  <script type="module" src="../js/world/app.js?v=17"></script>
</body>
</html>
