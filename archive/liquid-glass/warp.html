<!doctype html><html><head><meta charset="utf-8"><title>warp proof</title>
<style>
html,body{margin:0;background:#000;color:#fff}
.bg{position:fixed;inset:0;background:repeating-linear-gradient(90deg,#000 0 18px,#fff 18px 36px)}
.bgtext{position:fixed;inset:0;font:900 120px/1 Georgia,serif;color:#ff0;letter-spacing:-4px;padding:8px;
  -webkit-text-stroke:4px #f0f}
.wrap{position:relative;z-index:2;display:grid;gap:16px;padding:26px}
.tag{font:700 11px/1 ui-monospace,monospace;background:#000;border:1px solid #fff6;padding:3px 6px;display:inline-block;margin-bottom:6px}
.g{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.018) 62%,rgba(255,255,255,.07)),rgba(16,16,20,.44);
  font:600 15px/1 system-ui;text-shadow:0 1px 3px #000}
@supports (backdrop-filter: url("#lg-refract")){
  .lens{ backdrop-filter: url(#lg-refract) blur(5px) saturate(1.8) brightness(.94) }
}
.flat{ backdrop-filter: blur(14px) saturate(1.8) brightness(.94) }
</style></head><body>
<div class="bg"></div><div class="bgtext">GLASS</div>
<div class="wrap">
  <div><span class="tag">blur(14) only — NO lens (this is what Safari/Firefox get)</span><div class="g flat">Selected</div></div>
  <div><span class="tag">url(#lg-refract) blur(5) — WITH the lens</span><div class="g lens">Selected</div></div>
</div>
<svg width="0" height="0" style="position:absolute"><defs>
