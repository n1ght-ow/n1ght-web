# Replace SERVER_PUBLIC_IP. Add alongside existing virtual hosts.
limit_req_zone $binary_remote_addr zone=myscore_requests:1m rate=10r/s;

server {
    listen 80;
    server_name SERVER_PUBLIC_IP;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name SERVER_PUBLIC_IP;
    ssl_certificate /etc/letsencrypt/live/SERVER_PUBLIC_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_PUBLIC_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    location /api/v1/ {
        limit_req zone=myscore_requests burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 50s;
        proxy_buffering on;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
